<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2D Multiplayer City Gate - Random Questions</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Phetsarath OT","Noto Sans Lao",Arial,sans-serif;
    background:#111;
}

button,input{
font-family:"Phetsarath OT","Noto Sans Lao",Arial,sans-serif;
}

#login{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,#4967ff,#171b45 45%,#090b18);
    z-index:1000;
}

.loginBox{
    width:min(430px,90vw);
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3);
    box-shadow:0 20px 70px rgba(0,0,0,.45);
    text-align:center;
    color:white;
}

.loginBox h1{
    margin:0 0 10px;
    font-size:32px;
}

.loginBox p{
    opacity:.8;
}

.loginBox input{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:0;
    border-radius:12px;
    font-size:18px;
    outline:none;
}

.loginBox button{
    width:100%;
    margin-top:12px;
    padding:16px;
    border:0;
    border-radius:14px;
    background:#20d46b;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#loginError{
    color:#ff8d8d;
    min-height:25px;
    margin-top:10px;
}

#game{
    position:fixed;
    inset:0;
    display:none;
    overflow:hidden;
    background:#6fa96f;

    z-index:100;
}

#worldCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.65);
    border:2px solid rgba(255,255,255,.25);
    border-radius:15px;
    padding:12px 16px;
    min-width:190px;
}

#hudName{
font-family:"Phetsarath OT","Noto Sans Lao",Arial,sans-serif;
    font-weight:bold;
    font-size:18px;
}

#hudCity{
    margin-top:4px;
    color:#ffe66d;
}

#miniMap{
    position:absolute;
    right:15px;
    top:15px;
    width:210px;
    height:210px;
    background:#15251a;
    border:3px solid white;
    border-radius:14px;
    overflow:hidden;
    z-index:20;
}

#miniCanvas{
    width:100%;
    height:100%;
    display:block;
}

#message{
    position:absolute;
    left:50%;
    top:18px;
    transform:translateX(-50%);
    z-index:30;
    background:rgba(0,0,0,.7);
    color:white;
    padding:10px 20px;
    border-radius:20px;
    font-size:16px;
    opacity:0;
    transition:.2s;
    pointer-events:none;
}

#message.show{
    opacity:1;
}

#controls{
    position:absolute;
    left:24px;
    bottom:24px;
    z-index:25;
    width:150px;
    height:150px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

#joystickBase{
    position:absolute;
    left:0;
    top:0;
    width:150px;
    height:150px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.45);
    background:rgba(0,0,0,.38);
    box-shadow:
        0 8px 25px rgba(0,0,0,.35),
        inset 0 0 0 12px rgba(255,255,255,.06);
    touch-action:none;
}

#joystickKnob{
    position:absolute;
    left:50%;
    top:50%;
    width:66px;
    height:66px;
    margin-left:-33px;
    margin-top:-33px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.75);
    background:rgba(22,140,255,.78);
    box-shadow:0 5px 18px rgba(0,0,0,.4);
    pointer-events:none;
    transform:translate(0,0);
}

#joystickBase::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    margin-left:-5px;
    margin-top:-5px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    pointer-events:none;
}

@media (max-width:600px){
    #controls{
        left:18px;
        bottom:18px;
        width:170px;
        height:170px;
    }

    #joystickBase{
        width:170px;
        height:170px;
    }

    #joystickKnob{
        width:72px;
        height:72px;
        margin-left:-36px;
        margin-top:-36px;
    }
}

.questionBox{
    width:min(650px,94vw);
    background:#172033;
    color:white;
    border:3px solid #ffd54a;
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.questionTitle{
    text-align:center;
    color:#ffd54a;
    font-size:25px;
    font-weight:bold;
    margin-bottom:12px;
}

#questionText{
    background:#25334e;
    border-radius:15px;
    padding:20px;
    font-size:22px;
    line-height:1.5;
    text-align:center;
    margin-bottom:15px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.answer{
    min-height:65px;
    border:2px solid #53627e;
    border-radius:14px;
    background:#263552;
    color:white;
    font-size:19px;
    padding:12px;
    cursor:pointer;
}

.answer:hover{
    background:#344a70;
}

.answer.correct{
    background:#159447;
    border-color:#55f09a;
}

.answer.wrong{
    background:#b82d3a;
    border-color:#ff7c87;
}

#gateHint{
    text-align:center;
    margin-top:12px;
    color:#aaa;
}

#deathOverlay,
#offline{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:900;
    background:rgba(0,0,0,.82);
    color:white;
    text-align:center;
}

.deathBox{
    padding:35px;
    background:#24131a;
    border:3px solid #ff5252;
    border-radius:25px;
}

#deathTimer{
    font-size:45px;
    color:#ff7777;
    font-weight:bold;
}

.offlineBox{
    padding:30px;
    background:#191919;
    border:2px solid #ffb52e;
    border-radius:20px;
}

@media(max-width:600px){
    #miniMap{
        width:145px;
        height:145px;
    }

    #hud{
        font-size:13px;
        min-width:150px;
    }

    .answers{
        grid-template-columns:1fr;
    }

    #questionText{
        font-size:18px;
    }

    .answer{
        min-height:55px;
        font-size:17px;
    }
}
/* =========================
   ผู้ครองเมือง
========================= */
#topCityPlayers{
    position:fixed;
    right:8px;
    bottom:1px;

    min-width:120px;
    height:40px;

    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;

    color:#fff;

    z-index:200;
    cursor:pointer;
    pointer-events:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        width .2s ease,
        height .2s ease,
        padding .2s ease;
}

/* ปุ่ม 👑 */
#topCityButton{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

/* ข้อมูล ซ่อนไว้ตอนปกติ */
#topCityInfo{
    display:none;
}


/* =========================
   ตอนกดเปิด
========================= */

#topCityPlayers.expanded{
    width:280px;
    height:auto;

    min-height:80px;
    max-height:50vh;

    padding:10px;

    display:block;
    overflow-y:auto;
}

#topCityPlayers.expanded #topCityButton{
    height:28px;
    justify-content:flex-end;

    font-size:16px;
}

#topCityPlayers.expanded #topCityInfo{
    display:block;
}


/* =========================
   มือถือ
========================= */

@media(max-width:600px){

    #topCityPlayers{
        right:6px;
        bottom:6px;

        width:40px;
        height:40px;
    }

    #topCityPlayers.expanded{
        width:calc(100vw - 20px);
        right:10px;
        bottom:10px;

        padding:10px;
    }

    #topCityButton{
        font-size:19px;
    }

    #topCityPlayers.expanded #topCityButton{
        font-size:16px;
    }
}

/* =========================
   QUESTION OVERLAY
   ต้องทับทุก UI
========================= */
#questionOverlay{
    position:absolute;
    inset:0;

    z-index:999999;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.72);
    padding:20px;

    pointer-events:auto;
}

.topCityTitle{
    font-size:16px;
    font-weight:bold;
    text-align:center;
    margin-bottom:7px;
}

.topCityRow{
    display:flex;
    align-items:center;
    gap:7px;
    padding:5px 4px;
    border-top:1px solid rgba(255,255,255,.10);
}

.topCityRank{
    width:22px;
    font-weight:bold;
    text-align:center;
}

.topCityName{
    flex:1;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.topCityCount{
    font-size:13px;
    font-weight:bold;
}
.answer{
    min-height:65px;
    border:2px solid #53627e;
    border-radius:14px;
    background:#263552;
    color:white;
    font-size:19px;
    padding:12px;
    cursor:pointer;

    /* สำคัญสำหรับมือถือ */
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
}
</style>
</head>

<!-- LOGIN -->
<div id="login">

</div>


<!-- GAME -->

        </canvas>

    <!-- MOBILE CONTROL -->

        </div>
    </div>


    <!-- 🏆 TOP CITY PLAYERS

        <div class="topCityTitle">

                <button

                </button>

                <button

            </div>

        </div>

    </div>

</div>


<!-- DEATH -->
<div id="deathOverlay">

    <div class="deathBox">

        <h1>💀 ผู้เล่นเสียชีวิต</h1>

        <p>
            สามารถกลับมาเล่นได้ใน
        </p>

        <div id="deathTimer">
            05:00
        </div>

    </div>

</div>


<!-- OFFLINE -->
<div id="offline">

</div>

async function hashPlayer(name,password){

    const data =
        new TextEncoder().encode(name+"::"+password);

    const hash =
        await crypto.subtle.digest("SHA-256",data);

    return [...new Uint8Array(hash)]
        .map(x=>x.toString(16).padStart(2,"0"))
        .join("");
}


async function login(){

    const name =
        document.getElementById("nameInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;

    const error =
        document.getElementById("loginError");

    if(!name || !password){

        error.textContent =
            "กรุณากรอกชื่อและรหัสผ่าน";

        return;
    }

    loginBtn.disabled = true;

    try{

        playerId =
            await hashPlayer(name,password);

            ref(db,"players/"+playerId);

        const snapshot =
            await get(playerRef);

            ? snapshot.val()

       localPlayer = {

    name:name,

    level:old?.level ?? 1,

    x:old?.x ?? 0,

            dead:old?.dead ?? false,

            deathUntil:old?.deathUntil ?? 0,

            online:true,

            lastActivity:Date.now(),

function kickPlayerOutOfCity(city){

    const margin = 25;

    // จุดออกจากเมืองทางขวา
    let newX = city.x + city.width / 2 + margin;
    let newY = city.y;

    // กันไม่ให้ออกนอกขอบจอ
    newX = Math.max(20, Math.min(canvas.width - 20, newX));
    newY = Math.max(20, Math.min(canvas.height - 20, newY));

    // ถ้าจุดด้านขวายังอยู่ในเมือง
    if(
        newX >= city.x - city.width / 2 &&
        newX <= city.x + city.width / 2 &&
        newY >= city.y - city.height / 2 &&
        newY <= city.y + city.height / 2
    ){
        newX = city.x - city.width / 2 - margin;

        newX = Math.max(
            20,
            Math.min(canvas.width - 20, newX)
        );
    }

    localPlayer.x = newX;
    localPlayer.y = newY;
}

let saveTimer = 0;

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

(function(){

    const base =
        document.getElementById("joystickBase");

    const knob =
        document.getElementById("joystickKnob");

    if(!base || !knob) return;

    let active=false;
    let pointerId=null;

    function resetJoystick(){

        active=false;
        pointerId=null;

        keys.up=false;
        keys.down=false;
        keys.left=false;
        keys.right=false;

        knob.style.transform="translate(0px,0px)";
    }

    function updateJoystick(e){

        const rect=base.getBoundingClientRect();

        const cx=rect.left+rect.width/2;
        const cy=rect.top+rect.height/2;

        let dx=e.clientX-cx;
        let dy=e.clientY-cy;

        const maxDistance =
            rect.width/2-36;

        const distance =
            Math.hypot(dx,dy);

        if(distance>maxDistance){

            dx =
                dx/distance*
                maxDistance;

            dy =
                dy/distance*
                maxDistance;
        }

        knob.style.transform =
            "translate("+
            dx+"px,"+
            dy+"px)";

        const deadZone=10;

        keys.up =
            dy < -deadZone;

        keys.down =
            dy > deadZone;

        keys.left =
            dx < -deadZone;

        keys.right =
            dx > deadZone;

        if(
            Math.abs(dx)<=deadZone &&
            Math.abs(dy)<=deadZone
        ){
            keys.up=false;
            keys.down=false;
            keys.left=false;
            keys.right=false;
        }

        lastActivity=Date.now();
    }

    base.addEventListener("pointerdown",e=>{

        e.preventDefault();

        active=true;
        pointerId=e.pointerId;

        try{
            base.setPointerCapture(pointerId);
        }catch(_){ }

        updateJoystick(e);
    });

    base.addEventListener("pointermove",e=>{

        if(!active || e.pointerId!==pointerId)
            return;

        e.preventDefault();

        updateJoystick(e);
    });

    base.addEventListener("pointerup",e=>{

        if(e.pointerId===pointerId)
            resetJoystick();
    });

    base.addEventListener("pointercancel",e=>{

        if(e.pointerId===pointerId)
            resetJoystick();
    });

    base.addEventListener("lostpointercapture",resetJoystick);

})();


/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(){

    if(!localPlayer) return;
    if(localPlayer.dead) return;
    if(questionOpen) return;

    let dx = 0;
    let dy = 0;

    if(keys.left)  dx -= 1;
    if(keys.right) dx += 1;
    if(keys.up)    dy -= 1;
    if(keys.down)  dy += 1;

    if(dx === 0 && dy === 0) return;

    const length = Math.hypot(dx,dy);

    dx /= length;
    dy /= length;

    const step = MOVE_SPEED;

    const nx = localPlayer.x + dx * step;
    const ny = localPlayer.y + dy * step;

    // ขอบโลก
    if(nx < -HALF || nx > HALF) return;
    if(ny < -HALF || ny > HALF) return;

    /*
       ตรวจ X และ Y แยกกัน
       เพื่อให้เดินเลียบกำแพงได้
    */

    const canMoveX =
        !wouldEnterLockedCity(
            nx,
            localPlayer.y
        );

    const canMoveY =
        !wouldEnterLockedCity(
            localPlayer.x,
            ny
        );

    if(canMoveX){
        localPlayer.x = nx;
    }

    if(canMoveY){
        localPlayer.y = ny;
    }

    if(canMoveX || canMoveY){

        localPlayer.lastActivity = Date.now();

        savePlayer();
    }
}


/* =========================================================
   LOCKED CITY COLLISION
========================================================= */

function insideCity(city,x,y){

    return pointInsideCityShape(city,x,y);

}


function nearGate(city,x,y){

    const g = city.gate;

    const halfW = g.width / 2 + 20;
    const halfH = g.height / 2 + 20;

    return (
        x >= g.x - halfW &&
        x <= g.x + halfW &&
        y >= g.y - halfH &&
        y <= g.y + halfH
    );
}

function wouldEnterLockedCity(x, y){
    if(!localPlayer) return false;

    for(const city of cities){

        // เมืองของตัวเอง เข้าได้
        if(isMyCity(city.id)){
            continue;
        }

        // ต้องอยู่ในพื้นที่เมืองก่อน
        if(!pointInsideCityShape(city, x, y)){
            continue;
        }

        // ถ้าเป็นบริเวณประตู/แม่กุญแจ
        if(nearGate(city, x, y)){

            // ถ้าเมืองนี้กำลังติด Cooldown
            const cooldownUntil = cityCooldowns[city.id] || 0;

            if(Date.now() < cooldownUntil){
                return true;
            }

            // เมืองยังไม่ถูกยึด → ประตูต้องถูกล็อก
            return true;
        }

        // ถ้าอยู่ในเมืองอยู่แล้ว อนุญาตให้ออก
        const wasInside =
            pointInsideCityShape(
                city,
                localPlayer.x,
                localPlayer.y
            );

        if(wasInside){
            continue;
        }

        // พยายามเข้าพื้นที่เมืองที่ไม่ใช่ของตัวเอง
        return true;
    }

    return false;
}

function normalizeQuestion(item){

    if(!item){
        return null;
    }

    // =========================
    // รูปแบบใหม่
    // =========================
    if(
        item.question &&
        Array.isArray(item.choices)
    ){

        const correctIndex =
            item.choices.findIndex(
                choice => choice === item.answer
            );

        if(correctIndex < 0){
            console.error(
                "ไม่พบคำตอบที่ถูกต้อง:",
                item
            );
            return null;
        }

        return {
            q: item.question,
            a: item.choices,
            correct: correctIndex
        };
    }


    // =========================
    // รูปแบบเดิม
    // =========================
    if(
        item.q &&
        Array.isArray(item.a)
    ){

        return {
            q: item.q,
            a: item.a,
            correct: Number(item.correct)
        };
    }


    console.error(
        "รูปแบบคำถามไม่ถูกต้อง:",
        item
    );

    return null;
}
function shuffleQuestionChoices(q){

    const choices = q.a.map((text,index)=>({

        text:text,

        correct:
            index === q.correct

    }));


    for(
        let i = choices.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            choices[i],
            choices[j]
        ] =
        [
            choices[j],
            choices[i]
        ];
    }


    return choices;
}

/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

    const w=innerWidth;
    const h=innerHeight;


    ctx.clearRect(0,0,w,h);


    ctx.save();

const halfViewW = w / 2;
const halfViewH = h / 2;

let viewCameraX = cameraX;
let viewCameraY = cameraY;

// ล็อกกล้องไม่ให้เห็นนอกแมพ
if(WORLD_SIZE >= w){
    viewCameraX = Math.max(
        -HALF + halfViewW,
        Math.min(HALF - halfViewW, viewCameraX)
    );
}else{
    viewCameraX = 0;
}

if(WORLD_SIZE >= h){
    viewCameraY = Math.max(
        -HALF + halfViewH,
        Math.min(HALF - halfViewH, viewCameraY)
    );
}else{
    viewCameraY = 0;
}

ctx.translate(
    w/2-viewCameraX,
    h/2-viewCameraY
);


    /*
       พื้นโลก
    */

    ctx.fillStyle="#79a96b";

    ctx.fillRect(
        -HALF,
        -HALF,
        WORLD_SIZE,
        WORLD_SIZE
    );


    /*
       GRID
    */

    ctx.strokeStyle="rgba(255,255,255,.08)";
    ctx.lineWidth=1;

    for(let x=-HALF;x<=HALF;x+=100){

        ctx.beginPath();
        ctx.moveTo(x,-HALF);
        ctx.lineTo(x,HALF);
        ctx.stroke();

    }

    for(let y=-HALF;y<=HALF;y+=100){

        ctx.beginPath();
        ctx.moveTo(-HALF,y);
        ctx.lineTo(HALF,y);
        ctx.stroke();

    }


    drawRoads();

    drawNature();

    cities.forEach(drawCity);

    drawRemotePlayers();

    drawLocalPlayer();


    ctx.restore();

}


/* =========================================================
   ROADS
========================================================= */

function drawRoads(){

    ctx.strokeStyle="#d4b77b";
    ctx.lineWidth=35;
    ctx.lineCap="round";

    /*
       horizontal roads
    */

    for(let row=0;row<5;row++){

        for(let col=0;col<3;col++){

            const a=cities[row*4+col];
            const b=cities[row*4+col+1];

            ctx.beginPath();

            ctx.moveTo(a.x+250,a.y);
            ctx.lineTo(b.x-250,b.y);

            ctx.stroke();

        }

    }


    /*
       vertical roads
    */

    for(let row=0;row<4;row++){

        for(let col=0;col<4;col++){

            const a=cities[row*4+col];
            const b=cities[(row+1)*4+col];

            ctx.beginPath();

            ctx.moveTo(a.x,a.y+250);
            ctx.lineTo(b.x,b.y-250);

            ctx.stroke();

        }

    }

}

   NATURE
========================================================= */

function drawNature(){

    for(let i=0;i<100;i++){

        const x =
            Math.sin(i*77.13)*1400;

        const y =
            Math.cos(i*42.37)*1400;


        /*
           ไม่วางธรรมชาติในใจกลางเมือง
        */

        let inside=false;

        for(const city of cities){

            if(
                Math.abs(x-city.x)<270 &&
                Math.abs(y-city.y)<270
            ){

                inside=true;
                break;

            }

        }

        if(inside)
            continue;


        drawTree(x,y);

    }


    for(let i=0;i<30;i++){

        const x =
            Math.sin(i*17.3)*1400;

        const y =
            Math.cos(i*29.7)*1400;

        drawMountain(x,y);

    }

}


function drawTree(x,y){

    ctx.fillStyle="#74452b";

    ctx.fillRect(
        x-6,
        y,
        12,
        30
    );

    ctx.fillStyle="#246b35";

    ctx.beginPath();

    ctx.arc(
        x,
        y-5,
        25,
        0,
        Math.PI*2
    );

    ctx.fill();

}


function drawMountain(x,y){

    ctx.fillStyle="#5d6b5e";

    ctx.beginPath();

    ctx.moveTo(x-45,y+30);
    ctx.lineTo(x,y-45);
    ctx.lineTo(x+50,y+30);
    ctx.closePath();

    ctx.fill();

}

function cityPath(ctx, shape, x, y, w, h, t=0){
    const r=Math.min(w,h)/2;
    ctx.beginPath();
    if(shape==="circle"){
        ctx.arc(x,y,r,0,Math.PI*2);
    }else if(shape==="hex"){
        for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.closePath();
    }else if(shape==="diamond"||shape==="diamond2"){
        ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y);ctx.lineTo(x,y+h/2);ctx.lineTo(x-w/2,y);ctx.closePath();
    }else if(shape==="octagon"){
        const rx=w/2, ry=h/2, c=55;
        ctx.moveTo(x-rx+c,y-ry);ctx.lineTo(x+rx-c,y-ry);ctx.lineTo(x+rx,y-ry+c);ctx.lineTo(x+rx,y+ry-c);ctx.lineTo(x+rx-c,y+ry);ctx.lineTo(x-rx+c,y+ry);ctx.lineTo(x-rx,y+ry-c);ctx.lineTo(x-rx,y-ry+c);ctx.closePath();
    }else if(shape==="triangle"){
        ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();
    }else if(shape==="star"){
        for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:r*.48;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();
    }else if(shape==="cross"){
        const a=w*.22,b=w*.44;ctx.moveTo(x-a,y-h/2);ctx.lineTo(x+a,y-h/2);ctx.lineTo(x+a,y-b);ctx.lineTo(x+b,y-b);ctx.lineTo(x+b,y+b);ctx.lineTo(x+a,y+b);ctx.lineTo(x+a,y+h/2);ctx.lineTo(x-a,y+h/2);ctx.lineTo(x-a,y+b);ctx.lineTo(x-b,y+b);ctx.lineTo(x-b,y-b);ctx.lineTo(x-a,y-b);ctx.closePath();
    }else if(shape==="shield"){
        ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2,y+h*.12);ctx.quadraticCurveTo(x,y+h/2,x,y+h/2);ctx.quadraticCurveTo(x-w/2,y+h*.12,x-w/2,y-h/2);ctx.closePath();
    }else if(shape==="flower"){
        for(let i=0;i<8;i++){const a=i*Math.PI/4, rr=i%2?r:r*.72;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();
    }else if(shape==="castle"){
        ctx.rect(x-w/2,y-h/2,w,h);
    }else if(shape==="pill"){
        ctx.roundRect(x-w/2,y-h/2,w,h,90);
    }else if(shape==="arch"){
        ctx.moveTo(x-w/2,y+h/2);ctx.lineTo(x-w/2,y-h*.1);ctx.arc(x,y-h*.1,w/2,Math.PI,0);ctx.lineTo(x+w/2,y+h/2);ctx.closePath();
    }else if(shape==="gear"){
        const n=16;
        for(let i=0;i<n;i++){const a=-Math.PI/2+i*Math.PI*2/n,rr=i%2?r:r*.82;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();
    }else if(shape==="wave"){
        ctx.moveTo(x-w/2,y-h/2);
        for(let i=0;i<=10;i++){const px=x-w/2+i*w/10,py=y-h/2+((i%2)*22);ctx.lineTo(px,py);}
        ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();
    }else if(shape==="sun"){
        ctx.arc(x,y,r*.68,0,Math.PI*2);
    }else if(shape==="moon"){
        ctx.arc(x,y,r*.8,0,Math.PI*2);
    }else if(shape==="leaf"){
        ctx.moveTo(x,y-h/2);ctx.bezierCurveTo(x+w/2,y-h*.18,x+w*.28,y+h/2,x,y+h/2);ctx.bezierCurveTo(x-w*.28,y+h/2,x-w/2,y-h*.18,x,y-h/2);ctx.closePath();
    }else{
        ctx.roundRect(x-w/2,y-h/2,w,h,28);
    }
}
function pointInsideCityShape(city, px, py){

    const left   = city.x - city.width / 2;
    const right  = city.x + city.width / 2;
    const top    = city.y - city.height / 2;
    const bottom = city.y + city.height / 2;

    return (
        px >= left &&
        px <= right &&
        py >= top &&
        py <= bottom
    );
}
function drawCityDecor(city, theme, t){
    const x=city.x,y=city.y,w=city.width,h=city.height;
    ctx.save();
    ctx.globalAlpha=.85;
    ctx.strokeStyle=theme.accent;
    ctx.fillStyle=theme.accent;
    ctx.lineWidth=4;

    const phase=t/900 + city.id;
    if(theme.anim==="pulse"){
        const rr=65+Math.sin(phase)*12;
        ctx.globalAlpha=.18+.12*(Math.sin(phase)+1);
        ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.stroke();
    }
    if(theme.anim==="orbit"){
        for(let i=0;i<4;i++){const a=phase+i*Math.PI/2;ctx.beginPath();ctx.arc(x+Math.cos(a)*145,y+Math.sin(a)*145,8,0,Math.PI*2);ctx.fill();}
    }
    if(theme.anim==="spin"){
        ctx.translate(x,y);ctx.rotate(phase*.55);ctx.globalAlpha=.35;
        for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.fillRect(95,-4,42,8);}
        ctx.resetTransform();
    }
    if(theme.anim==="float"){
        for(let i=0;i<7;i++){const px=x-170+i*55, py=y+Math.sin(phase+i)*22;ctx.globalAlpha=.28;ctx.beginPath();ctx.arc(px,py,5+(i%3)*2,0,Math.PI*2);ctx.fill();}
    }
    if(theme.anim==="wave"){
        ctx.globalAlpha=.28;
        for(let j=0;j<3;j++){ctx.beginPath();for(let i=0;i<=16;i++){const px=x-w*.38+i*w*.05,py=y+120+j*24+Math.sin(phase+i*.8+j)*7; i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();}
    }
    if(theme.anim==="blink"){
        ctx.globalAlpha=.25+.5*(Math.sin(phase*1.8)+1)/2;
        for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(x-150+i*60,y-20+(i%2)*55,7,0,Math.PI*2);ctx.fill();}
    }

    if(theme.deco==="towers"||theme.deco==="spires"){
        for(let i=-1;i<=1;i++){ctx.fillRect(x+i*100-16,y-125,32,105);ctx.beginPath();ctx.moveTo(x+i*100-25,y-125);ctx.lineTo(x+i*100,y-165);ctx.lineTo(x+i*100+25,y-125);ctx.closePath();ctx.fill();}
    }else if(theme.deco==="trees"||theme.deco==="forest"){
        for(let i=0;i<6;i++){const px=x-180+(i%3)*180,py=y-115+Math.floor(i/3)*250;ctx.beginPath();ctx.arc(px,py,24,0,Math.PI*2);ctx.fill();}
    }else if(theme.deco==="crystals"||theme.deco==="energy"){
        for(let i=0;i<7;i++){const px=x-170+i*55,py=y+70+Math.sin(phase+i)*15;ctx.beginPath();ctx.moveTo(px,py-38);ctx.lineTo(px+16,py+25);ctx.lineTo(px-13,py+25);ctx.closePath();ctx.fill();}
    }else if(theme.deco==="flags"||theme.deco==="lamps"){
        for(let i=-1;i<=1;i++){const px=x+i*120;ctx.fillRect(px-3,y-130,6,130);ctx.beginPath();ctx.moveTo(px,y-130);ctx.lineTo(px+45,y-110);ctx.lineTo(px,y-90);ctx.closePath();ctx.fill();}
    }else if(theme.deco==="petals"||theme.deco==="leaves"||theme.deco==="moons"){
        for(let i=0;i<6;i++){const a=phase+i*Math.PI/3,px=x+Math.cos(a)*120,py=y+Math.sin(a)*120;ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fill();}
    }else if(theme.deco==="flames"||theme.deco==="rays"){
        for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*95,y+Math.sin(a)*95);ctx.lineTo(x+Math.cos(a)*145,y+Math.sin(a)*145);ctx.stroke();}
    }else if(theme.deco==="pipes"){
        for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x-180+i*90,y+110);ctx.lineTo(x-180+i*90,y+30);ctx.quadraticCurveTo(x-135+i*90,y-10,x-90+i*90,y+30);ctx.lineTo(x-90+i*90,y+105);ctx.stroke();}
    }else if(theme.deco==="stars"){
        for(let i=0;i<8;i++){const px=x-170+(i%4)*115,py=y-110+Math.floor(i/4)*210;ctx.beginPath();ctx.moveTo(px,py-10);ctx.lineTo(px+5,py);ctx.lineTo(px,py+10);ctx.lineTo(px-5,py);ctx.closePath();ctx.fill();}
    }else if(theme.deco==="water"){
        ctx.globalAlpha=.32;ctx.lineWidth=7;
        for(let j=0;j<3;j++){ctx.beginPath();for(let i=0;i<12;i++){const px=x-200+i*36,py=y-100+j*100+Math.sin(phase+i*.9+j)*9;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();}
    }
    ctx.restore();
}

function drawCity(city){

    const claim = cityClaims[city.id];

    const unlocked =
        !!(
            claim &&
            claim.playerId === playerId
        );

    const theme =
        CITY_THEMES[
            city.id % CITY_THEMES.length
        ];

    const t = performance.now();

    const left =
        city.x - city.width / 2;

    const top =
        city.y - city.height / 2;

    const right =
        city.x + city.width / 2;

    const bottom =
        city.y + city.height / 2;

    /* =====================================================
       พื้นที่เมืองด้านใน
    ===================================================== */

    ctx.save();

    ctx.fillStyle =
        theme.color + "55";

    ctx.fillRect(
        left,
        top,
        city.width,
        city.height
    );

    ctx.restore();


    /* =====================================================
       กำแพงเมือง
       เป็นสี่เหลี่ยมเหมือนกันทุกเมือง
    ===================================================== */

    const gate = city.gate;

    const gateLeft =
        gate.x - gate.width / 2;

    const gateRight =
        gate.x + gate.width / 2;


    ctx.save();

    ctx.shadowColor =
        "rgba(0,0,0,.35)";

    ctx.shadowBlur = 15;

    ctx.strokeStyle =
        unlocked
        ? "#69ff9b"
        : theme.accent;

    ctx.lineWidth = 18;

    /*
       วาดกำแพง 4 ด้าน
       แต่เว้นช่องประตูไว้ด้านล่าง
    */

    /* ด้านบน */
    ctx.beginPath();

    ctx.moveTo(left,top);
    ctx.lineTo(right,top);

    ctx.stroke();


    /* ด้านซ้าย */
    ctx.beginPath();

    ctx.moveTo(left,top);
    ctx.lineTo(left,bottom);

    ctx.stroke();


    /* ด้านขวา */
    ctx.beginPath();

    ctx.moveTo(right,top);
    ctx.lineTo(right,bottom);

    ctx.stroke();


    /* ด้านล่างซ้ายของประตู */
    ctx.beginPath();

    ctx.moveTo(left,bottom);
    ctx.lineTo(gateLeft,bottom);

    ctx.stroke();


    /* ด้านล่างขวาของประตู */
    ctx.beginPath();

    ctx.moveTo(gateRight,bottom);
    ctx.lineTo(right,bottom);

    ctx.stroke();

    ctx.restore();


    /* =====================================================
       ขอบกำแพงด้านใน
    ===================================================== */

    ctx.save();

    ctx.strokeStyle =
        "rgba(255,255,255,.25)";

    ctx.lineWidth = 3;

    ctx.strokeRect(
        left + 12,
        top + 12,
        city.width - 24,
        city.height - 24
    );

    ctx.restore();


    /* =====================================================
       อาคาร / Animation ภายในเมือง
       ยังใช้รูปทรงเดิมได้
       แต่ไม่ใช้เป็น collision
    ===================================================== */

    drawCityDecor(
        city,
        theme,
        t
    );


    /* =====================================================
       อาคาร
    ===================================================== */

    ctx.save();

    /*
       อาคารอยู่ในกรอบสี่เหลี่ยม
       ไม่ตัด collision
    */

    const bx = [
        -160,-55,55,160,
        -160,-55,55,160
    ];

    const by = [
        -115,-115,-115,-115,
        80,80,80,80
    ];

    for(let i=0;i<8;i++){

        const bob =
            theme.anim === "float"
            ? Math.sin(
                t / 700 +
                i +
                city.id
              ) * 5
            : 0;

        ctx.fillStyle =
            i % 2
            ? theme.accent + "aa"
            : "#f2f2f2";

        ctx.fillRect(
            city.x + bx[i] - 25,
            city.y + by[i] - 25 + bob,
            50,
            50
        );

        ctx.fillStyle =
            theme.color;

        ctx.fillRect(
            city.x + bx[i] - 16,
            city.y + by[i] - 12 + bob,
            13,
            12
        );

        ctx.fillRect(
            city.x + bx[i] + 3,
            city.y + by[i] - 12 + bob,
            13,
            12
        );
    }

    ctx.restore();


    /* =====================================================
       ชื่อเมือง
    ===================================================== */

ctx.textAlign = "center";

ctx.font =
    'bold 28px "Phetsarath OT","Noto Sans Lao",Arial,sans-serif';

ctx.fillStyle =
    "white";

ctx.strokeStyle =
    "rgba(0,0,0,.8)";

ctx.lineWidth = 6;

ctx.strokeText(
    city.name,
    city.x,
    city.y - 195
);

ctx.fillText(
    city.name,
    city.x,
    city.y - 195
);
/* =====================================================
   COOLDOWN เมืองที่ตอบผิด
===================================================== */

const cooldownUntil =
    cityCooldowns[city.id] || 0;

if(cooldownUntil > Date.now()){

    const seconds =
        Math.ceil(
            (cooldownUntil - Date.now()) / 1000
        );

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.font =
        'bold 24px "Phetsarath OT","Noto Sans Lao",Arial,sans-serif';

    ctx.fillStyle =
        "#ff5252";

    ctx.strokeStyle =
        "rgba(0,0,0,.9)";

    ctx.lineWidth = 5;

    ctx.strokeText(
        "⏳ " + seconds + "s",
        city.x,
        city.y - 155
    );

    ctx.fillText(
        "⏳ " + seconds + "s",
        city.x,
        city.y - 155
    );

    ctx.textBaseline = "alphabetic";
}

    /* =====================================================
       เจ้าของเมือง
    ===================================================== */

    if(claim && claim.name){

        const captureNumber =
            Number(claim.captureCount) || 1;

        const claimLabel =
            "🏆 " +
            claim.name +
            "  " +
            captureNumber;

        const labelY =
            city.y;

        ctx.textBaseline =
            "middle";

        ctx.font =
            "bold 38px Arial,sans-serif";

        const labelWidth =
            Math.min(
                ctx.measureText(claimLabel).width + 34,
                city.width - 24
            );

        const labelHeight = 62;

        ctx.fillStyle =
            "rgba(0,0,0,.86)";

        ctx.strokeStyle =
            theme.accent;

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.roundRect(
            city.x - labelWidth / 2,
            labelY - labelHeight / 2,
            labelWidth,
            labelHeight,
            14
        );

        ctx.fill();
        ctx.stroke();

        ctx.fillStyle =
            theme.accent;

        ctx.strokeStyle =
            "rgba(0,0,0,.95)";

        ctx.lineWidth = 3;

        ctx.strokeText(
            claimLabel,
            city.x,
            labelY
        );

        ctx.fillText(
            claimLabel,
            city.x,
            labelY
        );

        ctx.textBaseline =
            "alphabetic";
    }


    /* =====================================================
       ประตู
    ===================================================== */

    drawGate(city);
}
/* =========================================================
   GATE
========================================================= */

function drawGate(city){

    const g = city.gate;

    const claim =
        cityClaims[city.id];

    const unlocked =
        !!(
            claim &&
            claim.playerId === playerId
        );

    const left =
        g.x - g.width / 2;

    const top =
        city.y + city.height / 2 - 12;

    ctx.save();

    /*
       ตัวประตู
    */

    ctx.fillStyle =
        unlocked
        ? "#25c76a"
        : "#26313d";

    ctx.fillRect(
        left,
        top,
        g.width,
        g.height
    );


    /*
       ขอบ
    */

    ctx.strokeStyle =
        unlocked
        ? "#9affc0"
        : "#ffcc33";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        left,
        top,
        g.width,
        g.height
    );


    /*
       Icon
    */

    ctx.textAlign = "center";

    ctx.font =
        "30px Arial";

    ctx.fillStyle =
        "#fff";

    ctx.fillText(
        unlocked ? "🔓" : "🔒",
        g.x,
        top + 32
    );


    /*
       ข้อความ
    */

ctx.font =
    "bold 16px 'Phetsarath OT', 'Noto Sans Lao', sans-serif";

    ctx.fillText(
        unlocked
        ? "ເປີດແລ້ວ"
        : "ຕອບຄໍາຖາມ",
        g.x,
        top + 56
    );

    ctx.restore();
}


/* =========================================================
   LOCAL PLAYER
========================================================= */

function drawLocalPlayer(){

    if(!localPlayer)
        return;

    ctx.save();

    ctx.translate(
        localPlayer.x,
        localPlayer.y
    );


    /*
       เงา
    */

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        20,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       ตัวผู้เล่น
    */

    ctx.fillStyle="#168cff";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        20,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle="white";
    ctx.lineWidth=4;

    ctx.stroke();


    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        -6,
        -5,
        4,
        0,
        Math.PI*2
    );

    ctx.arc(
        6,
        -5,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}

/* =========================================================
   CURRENT CITY
========================================================= */

if(current){

const unlocked =

function drawCityReward(ctx, x, y, scale = 1){

    ctx.save();

    const size = Math.max(12, 34 * scale);

    // วงกลมพื้นหลัง
    ctx.beginPath();
    ctx.arc(
        x,
        y,
        size * 0.62,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(255,215,0,0.95)";
    ctx.fill();

    ctx.lineWidth = Math.max(1, 3 * scale);
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    // ถ้วยรางวัล
    ctx.font =
        `${size}px "Segoe UI Emoji","Noto Color Emoji",sans-serif`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText("🏆", x, y);

    ctx.restore();
}
/* =========================================================
   MINI MAP
========================================================= */

function drawMiniMap(){

    const size = 420;

    mctx.clearRect(
        0,
        0,
        size,
        size
    );


    /* =========================================================
       BACKGROUND
    ========================================================= */

    mctx.fillStyle = "#527b52";

    mctx.fillRect(
        0,
        0,
        size,
        size
    );


    /* =========================================================
       WORLD -> MINIMAP
    ========================================================= */

    const scale =
        size / WORLD_SIZE;


    /* =========================================================
       CITIES
    ========================================================= */

    for(const city of cities){

        const x =
            (city.x + HALF) * scale;

        const y =
            (city.y + HALF) * scale;


        /*
           ตรวจว่าเมืองนี้ผู้เล่นพิชิตแล้วหรือยัง
        */

const unlocked =
    !!localPlayer?.unlockedCities?.[city.id];

const claim =
    cityClaims?.[city.id];

const claimedByOther =
    !!(
        claim &&
        claim.playerId &&
        claim.playerId !== playerId
    );

const theme =
    CITY_THEMES[
        city.id % CITY_THEMES.length
    ];


        /*
           ขนาดเมืองบน Mini Map
        */

        const miniW =
            500 * scale;

        const miniH =
            500 * scale;


        /* =====================================================
           CITY SHAPE
        ===================================================== */

        mctx.save();

        mctx.globalAlpha = .82;


        mctx.fillStyle =
    unlocked
    ? "#6dff9a"
    : claimedByOther
        ? "#ff3030"
        : city.color;


        cityPath(
            mctx,
            theme.shape,
            x,
            y,
            miniW,
            miniH,
            performance.now()
        );

        mctx.fill();


        /* =====================================================
           CITY BORDER
        ===================================================== */

        mctx.globalAlpha = 1;

        mctx.strokeStyle =
    unlocked
    ? "#ffffff"
    : claimedByOther
        ? "#ff0000"
        : theme.accent;

        mctx.lineWidth = 2;


        cityPath(
            mctx,
            theme.shape,
            x,
            y,
            miniW,
            miniH,
            performance.now()
        );

        mctx.stroke();


        /* =====================================================
           CENTER POINT
        ===================================================== */

        mctx.fillStyle =
    unlocked
    ? "#ffffff"
    : claimedByOther
        ? "#ff0000"
        : theme.accent;

        mctx.globalAlpha = .9;


        mctx.beginPath();

        mctx.arc(
            x,
            y,
            Math.max(
                2,
                3 * scale / .1
            ),
            0,
            Math.PI * 2
        );

        mctx.fill();

        mctx.restore();


        /* =====================================================
           GATE
        ===================================================== */

        const gx =
            (city.gate.x + HALF) * scale;

        const gy =
            (city.gate.y + HALF) * scale;


        mctx.fillStyle =
            unlocked
            ? "#00ff80"
            : "#ffcc00";


        mctx.fillRect(
            gx - 5,
            gy - 4,
            10,
            8
        );


        /* =====================================================
           🏆 REWARD
           เมืองที่ผู้เล่นพิชิตแล้ว
        ===================================================== */

        if(claim){

            mctx.save();


            /*
               ตำแหน่งถ้วยรางวัล
               ให้อยู่เหนือเมือง
            */

const rewardX = x;
const rewardY = y;


            /*
               วงกลมพื้นหลัง
               ทำให้เห็นง่ายบน Mini Map
            */

            mctx.beginPath();

            mctx.arc(
    rewardX,
    rewardY,
    20,
    0,
    Math.PI * 2
);


            mctx.fillStyle =
                "rgba(0,0,0,.75)";

            mctx.fill();


            /*
               ขอบสีทอง
            */

            mctx.strokeStyle =
                "#ffd700";

            mctx.lineWidth = 2;

            mctx.stroke();


            /*
               🏆
            */

           mctx.font =
    '32px "Segoe UI Emoji","Noto Color Emoji",sans-serif';

            mctx.textAlign =
                "center";

            mctx.textBaseline =
                "middle";


            mctx.fillText(
                "🏆",
                rewardX,
                rewardY
            );


            mctx.restore();

        }

    }


    /* =========================================================
       REMOTE PLAYERS
    ========================================================= */

    for(const id in remotePlayers){

        const p =
            remotePlayers[id];


        const x =
            (p.x + HALF) * scale;

        const y =
            (p.y + HALF) * scale;


        mctx.fillStyle =
            "#ff304f";


        mctx.beginPath();

        mctx.arc(
            x,
            y,
            6,
            0,
            Math.PI * 2
        );

        mctx.fill();

    }


    /* =========================================================
       LOCAL PLAYER
    ========================================================= */

    if(localPlayer){

        const x =
            (localPlayer.x + HALF) * scale;

        const y =
            (localPlayer.y + HALF) * scale;


        mctx.fillStyle =
            "#168cff";


        mctx.beginPath();

        mctx.arc(
            x,
            y,
            8,
            0,
            Math.PI * 2
        );

        mctx.fill();


        mctx.strokeStyle =
            "white";

        mctx.lineWidth = 2;

        mctx.stroke();

    }


    /* =========================================================
       VIEWPORT
    ========================================================= */

    if(localPlayer){

        const vw =
            innerWidth /
            WORLD_SIZE *
            size;

        const vh =
            innerHeight /
            WORLD_SIZE *
            size;


        const vx =
            (cameraX + HALF) *
            scale -
            vw / 2;

        const vy =
            (cameraY + HALF) *
            scale -
            vh / 2;


        mctx.strokeStyle =
            "rgba(255,255,255,.7)";

        mctx.lineWidth = 2;


        mctx.strokeRect(
            vx,
            vy,
            vw,
            vh
        );

    }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;

function showMessage(text){

    const el =
        document.getElementById("message");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(()=>{
            el.classList.remove("show");
        },2500);

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const dpr =
        Math.min(devicePixelRatio||1,2);

    canvas.width =
        innerWidth*dpr;

    canvas.height =
        innerHeight*dpr;

    canvas.style.width =
        innerWidth+"px";

    canvas.style.height =
        innerHeight+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener("resize",resize);


/* =========================================================
   DEATH / AFK
========================================================= */

function checkAFK(){

    if(!localPlayer)
        return;

    if(
        Date.now()-localPlayer.lastActivity
        >10*60*1000
    ){

        if(!localPlayer.dead){

            localPlayer.dead=true;

            localPlayer.deathUntil =
                Date.now()+5*60*1000;

            savePlayer();

            showDeath();

        }

    }

}


function showDeath(){

    document.getElementById("deathOverlay")
        .style.display="flex";

}


function checkDeath(){

    if(!localPlayer)
        return;


    if(!localPlayer.dead)
        return;


    const remaining =
        localPlayer.deathUntil-Date.now();


    if(remaining<=0){

        respawn();

        return;

    }


    const sec =
        Math.ceil(remaining/1000);

    const min =
        Math.floor(sec/60);

    const s =
        sec%60;


    document.getElementById("deathTimer")
        .textContent=
        String(min).padStart(2,"0")+
        ":"+
        String(s).padStart(2,"0");

}


async function respawn(){

    const city =
        cities[
            Math.floor(
                Math.random()*cities.length
            )
        ];


    localPlayer.x=city.x;
    localPlayer.y=city.y+300;

    localPlayer.hp=100;

    localPlayer.dead=false;

    localPlayer.deathUntil=0;

    localPlayer.lastActivity=Date.now();


    await savePlayer();


    document.getElementById("deathOverlay")
        .style.display="none";

}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

    movePlayer();

    checkGate();

    updateCamera();

    updateCityHUD();

    drawWorld();

    drawMiniMap();

    checkAFK();

    checkDeath();

    requestAnimationFrame(loop);

}


resize();

requestAnimationFrame(loop);
function isMyCity(cityId){
    return cityClaims[cityId]?.playerId === playerId;
}
function listenTopCityPlayers(){

    const playersRef = ref(db, "players");

    onValue(playersRef, snapshot => {

        const data = snapshot.val() || {};

        const ranking = Object.entries(data)
            .map(([id, player]) => {

                const unlocked = player.unlockedCities || {};

                const cityCount =
                    Object.values(unlocked)
                        .filter(value => value === true)
                        .length;

                let status = "ອອນລາຍ";

                if(player.dead === true){
                    status = "💀 ຕາຍ";
                }
                else if(player.online === false){
                    status = "⚫ ອອບລາຍ";
                }

                return {
                    id,
                    name:
                        player.name ||
                        player.username ||
                        "Unknown",

                    cityCount,
                    status
                };
            })
            .sort((a,b) => {

                if(b.cityCount !== a.cityCount){
                    return b.cityCount - a.cityCount;
                }

                return a.name.localeCompare(b.name);
            })
            .slice(0,5);

        const container =
            document.getElementById("topCityPlayersList");

        if(!container) return;

        container.innerHTML = "";

        ranking.forEach((player,index) => {

            const row =
                document.createElement("div");

            row.className = "topCityRow";

            row.innerHTML = `
                <div class="topCityRank">
                    ${index + 1}
                </div>

                <div class="topCityName">
                    ${player.name}
                </div>

                <div class="topCityCount">
                    🏙️ ${player.cityCount}
                </div>

                <div class="topCityStatus">
                    ${player.status}
                </div>
            `;

            container.appendChild(row);
        });
    });
}
function updateTopCityPlayers(){

    const panel =
        document.getElementById("topCityPlayers");

    if(!panel) return;

    const login =
        document.getElementById("login");

    const game =
        document.getElementById("game");

    const inGame =
        game &&
        game.style.display === "block";

    const inLogin =
        login &&
        login.style.display !== "none";

    /* =========================
       อยู่หน้า Login
       ========================= */
    if(inLogin || !inGame){

        panel.style.display = "none";

        return;
    }

    /* =========================
       อยู่หน้า Game
       ========================= */
    panel.style.display = "block";
}
const topCityPlayers = document.getElementById("topCityPlayers");

topCityPlayers.addEventListener("click", () => {
    topCityPlayers.classList.toggle("expanded");
});
